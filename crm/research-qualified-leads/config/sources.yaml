research_budget:
  max_pages_per_candidate: 5
  max_minutes_per_candidate: 10

contact_enrichment:
  required: true
  require_at_least_one_valid_contact: true
  max_official_pages: 6
  page_priority:
    - contact
    - legal_notice
    - homepage_footer
    - about_or_team
    - careers
    - location_or_service_page
  unavailable_reasons:
    - NOT_PUBLISHED
    - ACCESS_BLOCKED
    - INVALID_PUBLISHED_VALUE

preferred_sources:
  - official_company_career_page
  - personio
  - greenhouse
  - lever
  - ashby
  - public_trade_fair_exhibitor_page
  - official_ad_transparency_library
  - public_job_board

fallback_attempts: 1
excluded_job_types:
  - working_student
  - internship
  - minijob
  - apprenticeship
  - student_assistant
  - volunteer
allowed_url_schemes:
  - http
  - https
