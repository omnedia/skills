<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caption styles</title><style>
*{box-sizing:border-box}body{margin:0;padding:40px;background:#14151b;color:#f5f5fa;font:16px system-ui}main{max-width:1440px;margin:auto}h1{margin-bottom:8px}.muted{color:#b5b7c6}#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:30px 0}.card{border:2px solid #454757;background:#22242e;color:inherit;border-radius:12px;padding:0;overflow:hidden;cursor:pointer;font:inherit}.card[aria-pressed=true]{border-color:#ffd54a}.preview{aspect-ratio:4/3;width:100%;background:#30333e;display:grid;place-items:center}.preview img{width:100%;height:100%;object-fit:contain}.label{display:block;padding:16px}.roles{display:flex;flex-wrap:wrap;gap:24px}label{display:grid;gap:8px}input,select,button{font:inherit}input[type=text]{width:115px}#sample{font-family:CaptionSample;font-size:36px;text-align:center;padding:60px 20px;margin:28px 0;background:repeating-conic-gradient(#333 0% 25%,#292929 0% 50%) 0/24px 24px;border-radius:12px}#save{padding:14px 24px;background:#ffd54a;border:0;border-radius:8px;cursor:pointer}#status{min-height:30px}@media(max-width:1000px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){#grid{grid-template-columns:1fr}body{padding:20px}}
#grid[hidden]{display:none}
</style></head><body><main><h1>Caption styles</h1><p class="muted">Choose a style, then set its colors. You can keep the displayed defaults.</p><div id="grid"></div><section id="colors" hidden><h2 id="style-name"></h2><div class="roles"></div><div id="sample">Every <span>word</span> matters.</div><button id="save">Use these colors and continue</button><p id="status" role="status"></p></section></main>
<script type="module">
const token=new URL(location.href).searchParams.get('token');
const endpoint=(p)=>`${p}${p.includes('?')?'&':'?'}token=${encodeURIComponent(token)}`;
const data=await fetch(endpoint('/catalog')).then(r=>r.json());let selected,colors;
const sample=document.querySelector('#sample');
function update(){if(sample.dataset.style!==selected.id)return;sample.style.color=colors.base;sample.style.textShadow=`0 2px 4px ${colors.shadow}99`;sample.style.webkitTextStroke=selected.id==='editorial-kinetic'?'0':`1px ${colors.shadow}66`;const emphasis=sample.querySelector('span');if(selected.id==='editorial-kinetic'){emphasis.style.cssText=`display:block;width:max-content;max-width:100%;margin:auto;text-shadow:none;filter:drop-shadow(0 2px 3px #0009);font:700 52px EditorialSamplePrimary;background:linear-gradient(${colors.creamTop},${colors.creamBottom});background-clip:text;color:transparent;padding-bottom:6px;border-bottom:5px solid ${colors.accent}`;sample.querySelector('small').style.color=colors.accent;sample.querySelector('em').style.borderBottom=`2px solid ${colors.stroke}`;sample.querySelector('b').style.cssText=`display:block;text-shadow:none;filter:drop-shadow(0 2px 3px #0009);font:700 36px EditorialSamplePrimary;background:linear-gradient(${colors.pinkTop},${colors.pinkBottom});background-clip:text;color:transparent`;}else{emphasis.style.cssText=`color:${colors.active}`;}}
async function loadSample(style){sample.style.visibility='hidden';try{const editorial=style.id==='editorial-kinetic';for(const role of editorial?['primary','serif','handwritten']:['primary']){const family=editorial?`EditorialSample${role[0].toUpperCase()+role.slice(1)}`:'CaptionSample';const face=await new FontFace(family,`url("${endpoint(`/font?id=${style.id}&role=${role}`)}")`,{weight:role==='primary'?'700':'400',style:role==='serif'?'italic':'normal'}).load();document.fonts.add(face);}if(selected!==style)return;sample.innerHTML=editorial?'<em style="font:italic 28px EditorialSampleSerif">Every word</em><span>matters.</span><b>Make it yours</b><small style="display:block;font:24px EditorialSampleHandwritten">your story</small>':'Every <span>word</span> matters.';sample.dataset.style=style.id;update();sample.style.visibility='visible';}catch(error){document.querySelector('#status').textContent=`Font preview unavailable: ${error.message}`;}}
function choose(style){selected=style;colors={...style.colors,...(data.selected===style.id?data.colors:{})};loadSample(style);document.querySelector('#colors').hidden=false;document.querySelector('#style-name').textContent=style.name;document.querySelectorAll('.card').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.id===style.id)));const roles=document.querySelector('.roles');roles.replaceChildren();
for(const role of Object.keys(style.colors)){const label=document.createElement('label');label.textContent=({base:'Base text',active:'Active word',shadow:'Shadow',creamTop:'Primary gradient top',creamBottom:'Primary gradient bottom',pinkTop:'Alternate gradient top',pinkBottom:'Alternate gradient bottom',accent:'Handwriting / accent underline',stroke:'Light drawn stroke'})[role] ?? role;const picker=document.createElement('input');picker.type='color';picker.value=colors[role];picker.setAttribute('aria-label',`${role} color`);const hex=document.createElement('input');hex.type='text';hex.value=colors[role];hex.setAttribute('aria-label',`${role} hex`);const palette=document.createElement('select');palette.setAttribute('aria-label',`${role} brand color`);palette.add(new Option('Choose a brand color',''));for(const [name,value]of Object.entries(data.brandColors))palette.add(new Option(`${name} — ${value}`,value));const set=v=>{if(/^#[a-f0-9]{6}$/i.test(v)){colors[role]=v;picker.value=v;hex.value=v;update();}};picker.oninput=()=>set(picker.value);hex.onchange=()=>set(hex.value);palette.onchange=()=>set(palette.value);label.append(picker,hex,palette);roles.append(label);}}
for(const style of data.catalog){const card=document.createElement('button');card.className='card';card.dataset.id=style.id;card.setAttribute('aria-pressed','false');const box=document.createElement('div');box.className='preview';box.textContent=style.name;if(style.previewAvailable){const img=document.createElement('img');img.alt=style.name;img.src=endpoint(`/preview?id=${encodeURIComponent(style.id)}`);img.onerror=()=>box.replaceChildren(document.createTextNode(style.name));box.replaceChildren(img);}const label=document.createElement('span');label.className='label';label.textContent=style.name;card.append(box,label);card.onclick=()=>choose(style);document.querySelector('#grid').append(card);}
if(data.selected){const style=data.catalog.find(s=>s.id===data.selected);if(style){document.querySelector('#grid').hidden=true;choose(style);}}
document.querySelector('#save').onclick=async()=>{const response=await fetch(endpoint('/select'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({style:selected.id,colors})});document.querySelector('#status').textContent=response.ok?'Saved. You can return to your task.':await response.text();};
</script></body></html>
