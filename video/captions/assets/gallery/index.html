<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caption styles</title><style>
*{box-sizing:border-box}body{margin:0;padding:40px;background:#14151b;color:#f5f5fa;font:16px system-ui}main{max-width:1440px;margin:auto}h1{margin-bottom:8px}.muted{color:#b5b7c6}#grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:30px 0}.card{border:2px solid #454757;background:#22242e;color:inherit;border-radius:12px;padding:0;overflow:hidden;cursor:pointer;font:inherit}.card[aria-pressed=true]{border-color:#ffd54a}.preview{aspect-ratio:4/3;width:100%;background:#30333e;display:grid;place-items:center}.preview img{width:100%;height:100%;object-fit:contain}.label{display:block;padding:16px}.roles{display:flex;flex-wrap:wrap;gap:24px}label{display:grid;gap:8px}input,select,button{font:inherit}input[type=text]{width:115px}#sample{font-family:CaptionSample;font-size:36px;text-align:center;padding:60px 20px;margin:28px 0;background:repeating-conic-gradient(#333 0% 25%,#292929 0% 50%) 0/24px 24px;border-radius:12px}#save{padding:14px 24px;background:#ffd54a;border:0;border-radius:8px;cursor:pointer}#status{min-height:30px}@media(max-width:1000px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){#grid{grid-template-columns:1fr}body{padding:20px}}
#grid[hidden]{display:none}
</style></head><body><main><h1>Caption styles</h1><p class="muted">Choose a style, then set its colors. You can keep the displayed defaults.</p><div id="grid"></div><section id="colors" hidden><h2 id="style-name"></h2><div class="roles"></div><div id="sample">Every <span>word</span> matters.</div><button id="save">Use these colors and continue</button><p id="status" role="status"></p></section></main>
<script type="module">
const token=new URL(location.href).searchParams.get('token');
const endpoint=(p)=>`${p}${p.includes('?')?'&':'?'}token=${encodeURIComponent(token)}`;
const font=new FontFace('CaptionSample',`url("${endpoint('/font')}")`,{weight:'700'});font.load().then(f=>document.fonts.add(f));
const data=await fetch(endpoint('/catalog')).then(r=>r.json());let selected,colors;
const sample=document.querySelector('#sample');
function update(){sample.style.color=colors.base;sample.querySelector('span').style.color=colors.active;sample.style.textShadow=`0 2px 4px ${colors.shadow}99`;sample.style.webkitTextStroke=`1px ${colors.shadow}66`;}
function choose(style){selected=style;colors={...style.colors,...(data.selected===style.id?data.colors:{})};document.querySelector('#colors').hidden=false;document.querySelector('#style-name').textContent=style.name;document.querySelectorAll('.card').forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.id===style.id)));const roles=document.querySelector('.roles');roles.replaceChildren();
for(const role of Object.keys(style.colors)){const label=document.createElement('label');label.textContent=role==='base'?'Base text':role==='active'?'Active word':'Shadow / outline';const picker=document.createElement('input');picker.type='color';picker.value=colors[role];picker.setAttribute('aria-label',`${role} color`);const hex=document.createElement('input');hex.type='text';hex.value=colors[role];hex.setAttribute('aria-label',`${role} hex`);const palette=document.createElement('select');palette.setAttribute('aria-label',`${role} brand color`);palette.add(new Option('Choose a brand color',''));for(const [name,value]of Object.entries(data.brandColors))palette.add(new Option(`${name} — ${value}`,value));const set=v=>{if(/^#[a-f0-9]{6}$/i.test(v)){colors[role]=v;picker.value=v;hex.value=v;update();}};picker.oninput=()=>set(picker.value);hex.onchange=()=>set(hex.value);palette.onchange=()=>set(palette.value);label.append(picker,hex,palette);roles.append(label);}update();}
for(const style of data.catalog){const card=document.createElement('button');card.className='card';card.dataset.id=style.id;card.setAttribute('aria-pressed','false');const box=document.createElement('div');box.className='preview';box.textContent=style.name;if(style.previewAvailable){const img=document.createElement('img');img.alt=style.name;img.src=endpoint(`/preview?id=${encodeURIComponent(style.id)}`);img.onerror=()=>box.replaceChildren(document.createTextNode(style.name));box.replaceChildren(img);}const label=document.createElement('span');label.className='label';label.textContent=style.name;card.append(box,label);card.onclick=()=>choose(style);document.querySelector('#grid').append(card);}
if(data.selected){const style=data.catalog.find(s=>s.id===data.selected);if(style){document.querySelector('#grid').hidden=true;choose(style);}}
document.querySelector('#save').onclick=async()=>{const response=await fetch(endpoint('/select'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({style:selected.id,colors})});document.querySelector('#status').textContent=response.ok?'Saved. You can return to your task.':await response.text();};
</script></body></html>
