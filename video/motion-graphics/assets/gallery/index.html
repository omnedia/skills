<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Omnedia Motion Graphics</title>
<style>body{font:17px system-ui;background:#ece9e2;color:#202124;max-width:960px;margin:40px auto;padding:24px}main{display:flex;gap:40px;flex-wrap:wrap}video{width:270px;border-radius:18px}section{flex:1;min-width:280px}label{display:flex;align-items:center;gap:20px;margin:18px 0}input{width:70px;height:44px}button{font:inherit;background:#202124;color:white;border:0;padding:14px 26px;border-radius:8px;cursor:pointer}.swatches{display:flex;height:45px}.swatches span{flex:1}</style>
<h1>Omnedia Motion Graphics</h1><main><div><video controls loop muted playsinline></video><p>Renderer demonstration · default palette</p></div><section><h2>Editorial collage</h2><p>Cutouts, layered depth and tactile paper. Choose your accent colors.</p><form><div id="roles"></div><div class="swatches"></div><p>Swatches update immediately. The recorded animation uses the default colors.</p><button>Save and continue</button></form><p id="status" role="status"></p></section></main>
<script type="module">
const token=new URLSearchParams(location.search).get('token'),url=p=>p+'?token='+encodeURIComponent(token),data=await(await fetch(url('/catalog'))).json(),style=data.catalog[0];
const form=document.querySelector('form'),roles=document.querySelector('#roles'),swatches=document.querySelector('.swatches');
for(const [role,color] of Object.entries(data.colors)){const label=document.createElement('label'),input=document.createElement('input'),swatch=document.createElement('span');input.type='color';input.name=role;input.value=color;label.append(input,document.createTextNode(role));roles.append(label);swatch.style.background=color;swatches.append(swatch);input.oninput=()=>swatch.style.background=input.value;}
if(data.previewAvailable)document.querySelector('video').src=url('/preview');else document.querySelector('video').replaceWith(document.createTextNode('Demonstration unavailable; colors remain selectable.'));
form.onsubmit=async e=>{e.preventDefault();const response=await fetch(url('/select'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({style:style.id,colors:Object.fromEntries(new FormData(form))})});document.querySelector('#status').textContent=response.ok?'Saved. Your task can continue.':await response.text();};
</script></html>
